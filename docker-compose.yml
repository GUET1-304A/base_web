services:
  # Flask 后端（配置从 .env.docker 加载，environment 仅覆盖 Docker 特定项）
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./.env.docker
    environment:
      FLASK_ENV: production
      APP_DEBUG: "false"
      UPLOAD_FOLDER: /app/uploads
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/xingyu_cms.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - db_data:/app/data
      - uploads_data:/app/uploads

  # Nginx 前端
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
