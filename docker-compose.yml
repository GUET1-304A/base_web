services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xingyu_mysql_2026}
      MYSQL_DATABASE: xingyu_cms
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask 后端
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-string}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-another-random-string}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xingyu_mysql_2026}
      MYSQL_DATABASE: xingyu_cms
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_FOLDER: /app/uploads
      APP_DEBUG: "false"
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_APP_ENABLED: ${FEISHU_APP_ENABLED:-false}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_APP_CHAT_ID: ${FEISHU_APP_CHAT_ID:-}
      FEISHU_APP_VERIFICATION_TOKEN: ${FEISHU_APP_VERIFICATION_TOKEN:-}
      FEISHU_APP_ENCRYPT_KEY: ${FEISHU_APP_ENCRYPT_KEY:-}
      APPLICATION_ACTION_BASE_URL: ${APPLICATION_ACTION_BASE_URL:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "true"
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-星雨作坊}
      SMTP_FROM: ${SMTP_FROM:-}
      DEFAULT_GITHUB_URL: ${DEFAULT_GITHUB_URL:-https://github.com}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Nginx 前端
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
